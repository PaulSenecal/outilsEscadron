<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JO du 5ESC — écran</title>
<meta name="description" content="Écran d'affichage des JO du 5e escadron : classement en direct, tirages au sort et podium.">
<meta name="theme-color" content="#0B1B33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0B1B33;--nuit-2:#12294A;--nuit-3:#1B3A63;--craie:#E8EDF4;--acier:#8FA6C4;--or:#C9A227;--argent:#B8C2CF;--bronze:#C07A43;--rouge:#C8102E;
  --disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 20% 0%,#16315A,var(--nuit) 60%);color:var(--craie);font-family:Barlow,system-ui,sans-serif;
  overflow:hidden;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:baseline;gap:2vw;padding:2.2vh 3vw 1vh;border-bottom:2px solid var(--nuit-3)}
header h1{font-family:var(--disp);font-weight:800;font-size:5.2vh;margin:0;text-transform:uppercase;letter-spacing:.02em}
header h1 b{color:var(--or)}
header .etape{margin-left:auto;text-align:right;font-size:2.2vh;color:var(--acier)}
header .etape b{color:var(--craie);font-weight:600}
header .heure{font-family:var(--disp);font-size:5vh;font-weight:600;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;padding:2.5vh 3vw;display:flex;flex-direction:column}

/* classement */
.rangs{display:flex;flex-direction:column;gap:1.4vh;flex:1;min-height:0}
.rang{display:grid;grid-template-columns:9vh 1fr auto 15vh;align-items:center;gap:2vw;background:linear-gradient(90deg,var(--nuit-2),rgba(18,41,74,.4));
  border:1px solid var(--nuit-3);border-radius:4px;padding:1vh 2vw;flex:1;max-height:15vh;position:relative;overflow:hidden;transition:transform .6s}
.rang .barre{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(201,162,39,.16),rgba(201,162,39,.02));z-index:0;transition:width .8s}
.rang>*{position:relative;z-index:1}
.rang .pl{font-family:var(--disp);font-size:7vh;font-weight:800;color:var(--acier);text-align:center;line-height:1}
.rang.p1 .pl{color:var(--or)}.rang.p2 .pl{color:var(--argent)}.rang.p3 .pl{color:var(--bronze)}
.rang .nom{font-family:var(--disp);font-size:6vh;font-weight:800;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rang .meds{display:flex;gap:1.2vw;font-size:3vh;font-variant-numeric:tabular-nums}
.rang .meds span{display:flex;align-items:center;gap:.5vw}
.med{display:inline-block;width:2.8vh;height:2.8vh;border-radius:50%;box-shadow:inset 0 -.35vh 0 rgba(0,0,0,.25)}
.med.or{background:var(--or)}.med.argent{background:var(--argent)}.med.bronze{background:var(--bronze)}
.rang .tot{font-family:var(--disp);font-size:8vh;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.rang .tot small{font-size:2.2vh;color:var(--acier);font-weight:600;display:block;font-family:Barlow,sans-serif}
.epreuves{display:flex;gap:1vw;margin-top:2.2vh;flex-wrap:wrap}
.epreuves div{flex:1;min-width:14vw;border:1px solid var(--nuit-3);border-radius:4px;padding:1vh 1vw;font-size:2vh;color:var(--acier)}
.epreuves div b{display:block;font-family:var(--disp);font-size:3vh;color:var(--craie);text-transform:uppercase;font-weight:600}
.epreuves div.fini{border-color:rgba(201,162,39,.6)}
.epreuves div.cours b::after{content:" ●";color:var(--rouge);animation:clig 1.4s infinite}
@keyframes clig{50%{opacity:.2}}

/* tirage */
.tirage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.tirage .t1{font-family:var(--disp);font-size:4vh;letter-spacing:.2em;text-transform:uppercase;color:var(--or)}
.tirage .t2{font-family:var(--disp);font-size:9vh;font-weight:800;text-transform:uppercase;line-height:1}
.tirage .nom{font-family:var(--disp);font-size:9vh;font-weight:800;text-transform:uppercase;line-height:1.1;border-bottom:.4vh solid var(--or);padding:0 3vw;
  animation:entre .7s both}
.tirage .nom small{font-size:.4em;color:var(--acier);margin-left:1vw}
.tirage .nom.barre{text-decoration:line-through;color:var(--rouge);border-color:var(--rouge)}
.tirage .msg{font-size:3vh;color:var(--acier)}
@keyframes entre{from{opacity:0;transform:translateY(3vh) scale(.96)}}

/* podium */
.podium{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:2vw;padding:0 4vw}
.marche{display:flex;flex-direction:column;align-items:center;gap:2vh}
.marche .socle{width:100%;border-radius:4px 4px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:2vh;
  font-family:var(--disp);font-weight:800;font-size:14vh;color:rgba(11,27,51,.55)}
.marche.m1 .socle{height:42vh;background:linear-gradient(var(--or),#8C6E12)}
.marche.m2 .socle{height:30vh;background:linear-gradient(var(--argent),#6E7A88)}
.marche.m3 .socle{height:21vh;background:linear-gradient(var(--bronze),#7A4520)}
.marche .qui{font-family:var(--disp);font-weight:800;font-size:7vh;text-transform:uppercase;text-align:center;line-height:1;min-height:7vh}
.marche .pts{font-size:3vh;color:var(--acier)}
.marche.cache .qui,.marche.cache .pts{visibility:hidden}
.marche.vu .qui{animation:entre 1s both}
.vide{flex:1;display:flex;align-items:center;justify-content:center;font-size:3vh;color:var(--acier);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>JO du <b>5ESC</b></h1>
  <div class="etape" id="etape"></div>
  <div class="heure" id="heure"></div>
</header>
<main id="main"></main>

<script type="module">
import * as J from './calcul.js';
import { esc } from './saisie.js';

const CLE = 'esc.jo.etat';
const $ = id => document.getElementById(id);
let etat, dernierTirage = null, dernierPodium = -1, dernierMode = null;

function charger() {
  try { etat = J.normaliser(JSON.parse(localStorage.getItem(CLE))); } catch { etat = J.etatVide(); }
}

function horloge() {
  const d = new Date();
  const hhmm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('heure').textContent = hhmm.replace(':', 'h');
  const { en, suivante } = J.etapeCourante(hhmm);
  $('etape').innerHTML = (en ? 'En cours : <b>' + esc(en.titre) + '</b>' : '') +
    (suivante ? (en ? '<br>' : '') + 'Ensuite : <b>' + esc(suivante.titre) + '</b> à ' + suivante.debut.replace(':', 'h') : '');
}

const medailles = r => ['or', 'argent', 'bronze'].map(m => `<span><i class="med ${m}"></i>${r[m]}</span>`).join('');

function classement() {
  const g = J.classementGeneral(etat);
  const max = Math.max(1, ...g.lignes.map(r => r.total));
  $('main').innerHTML = `<div class="rangs">${g.lignes.map(r => `
    <div class="rang p${r.place}">
      <div class="barre" style="width:${(100 * r.total / max).toFixed(1)}%"></div>
      <div class="pl">${r.place}</div>
      <div class="nom">${esc(r.eq.nom)}</div>
      <div class="meds">${medailles(r)}</div>
      <div class="tot">${r.total}<small>points</small></div>
    </div>`).join('')}</div>
    <div class="epreuves">${g.epreuves.map(c => {
      const premiers = c.lignes.filter(x => x.place === 1 && x.etat === 'ok').map(x => x.eq.nom);
      return `<div class="${c.terminee ? 'fini' : c.commencee ? 'cours' : ''}"><b>${esc(c.ep.court)}</b>${c.terminee ? 'Or : ' + esc(premiers.join(', ') || '—') : c.commencee ? 'En cours' : 'À venir'}</div>`;
    }).join('')}</div>`;
}

function tirage() {
  const t = etat.ecran.tirage;
  if (!t) { $('main').innerHTML = '<div class="vide">Aucun tirage pour l\'instant.</div>'; return; }
  if (dernierTirage === t.n && dernierMode === 'tirage') return;
  dernierTirage = t.n;
  $('main').innerHTML = `<div class="tirage"><div class="t1">${esc(t.t1)}</div><div class="t2">${esc(t.t2)}</div>
    ${J.liste(t.noms).map((n, i) => `<div class="nom ${n.barre ? 'barre' : ''}" style="animation-delay:${i * .6}s">${esc(n.nom)}${n.sous ? '<small>' + esc(n.sous) + '</small>' : ''}</div>`).join('')}
    ${t.msg ? `<div class="msg">${esc(t.msg)}</div>` : ''}</div>`;
}

function podium() {
  const etape = etat.ecran.podium || 0;
  if (dernierPodium === etape && dernierMode === 'podium') return;
  const g = J.classementGeneral(etat);
  const sur = p => g.lignes.filter(r => r.place === p);
  // Avec des ex aequo, plusieurs équipes partagent une marche.
  const marches = [[2, sur(2)], [1, sur(1)], [3, sur(3)]];
  const revelees = { 3: etape >= 1, 2: etape >= 2, 1: etape >= 3 };
  $('main').innerHTML = `<div class="podium">${marches.map(([p, rs]) => `
    <div class="marche m${p} ${revelees[p] ? (dernierPodium < etape && etape === 4 - p ? 'vu' : '') : 'cache'}">
      <div class="qui">${esc(rs.map(r => r.eq.nom).join(' / ') || '—')}</div>
      <div class="pts">${rs.length ? rs[0].total + ' points · ' + rs[0].or + ' or' : ''}</div>
      <div class="socle">${p}</div>
    </div>`).join('')}</div>`;
  dernierPodium = etape;
}

function rendre() {
  const mode = etat.ecran.mode;
  if (mode === 'tirage') tirage();
  else if (mode === 'podium') podium();
  else classement();
  dernierMode = mode;
}

charger(); horloge(); rendre();
setInterval(horloge, 10000);
addEventListener('storage', e => { if (e.key === CLE) { charger(); rendre(); } });
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
});
</script>
</body>
</html>
